<h3>伸长率与断面收缩率</h3>
<p>拉断后仍留下塑性变形。把断后标距 l₁ 与原始标距 l 的差相对于原标距的百分数定义为伸长率。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>δ</mi><mo>=</mo><mfrac><mrow><msub><mi>l</mi><mn>1</mn></msub><mo>−</mo><mi>l</mi></mrow><mi>l</mi></mfrac><mo>×</mo><mn>100</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">\delta=\frac{l_1-l}{l}\times100\%</annotation></semantics></math></div>
<p>伸长率用来衡量塑性。教材按约 5% 的伸长率区分塑性与脆性材料，碳钢、黄铜、铝合金为塑性材料的例子，灰铸铁、玻璃、陶瓷为脆性材料的例子。</p>
