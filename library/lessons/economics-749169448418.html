<p>1.8 改扩建项目经济评价</p>
<p>改扩建建设与生产同步进行，建设周期较短。要是改扩建项目的一些数据在原企业占比小或者相对独立，可以按照一般项目的评价进行。</p>

<h3>改扩建项目经济评价</h3>
<p>项目层次的财务分析包括盈利能力、清偿能力和财务生存能力分析。</p>
<p>改扩建项目需识别和估算“有项目”“无项目”“现状”“新增”“增量”五种状态下的资产、资源、效益和费用，遵循有无对比原则。</p>
