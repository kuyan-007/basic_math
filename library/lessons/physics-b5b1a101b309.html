<h3>11.布儒斯特定律</h3>
<p class="native-figure-text">自然光在介质界面发生反射、折射；布儒斯特角入射时反射光完全线偏振，反射光线与折射光线垂直。</p>
<p>①入射光：自然光</p>
<p>折射光：平行入射面光振较强</p>
<p>反射光：垂直入射面完全偏振光/线偏振光</p>
