<section id="part-1">
<h3>3.4 振动的固有频率</h3>
<p>无阻尼单自由度弹簧—质量系统作简谐振动。A 为振幅，φ 为初相位，ω₀ 为固有角频率。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>x</mi><mo>=</mo><mi>A</mi><mi>sin</mi><mo>⁡</mo><mo stretchy="false">(</mo><msub><mi>ω</mi><mn>0</mn></msub><mi>t</mi><mo>+</mo><mi>φ</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">x=A\sin(\omega_0t+\varphi)</annotation></semantics></math></div>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>ω</mi><mn>0</mn></msub><mo>=</mo><msqrt><mfrac><mi>k</mi><mi>m</mi></mfrac></msqrt></mrow><annotation encoding="application/x-tex">\omega_0=\sqrt{\frac{k}{m}}</annotation></semantics></math></div>
<p>计算时 k 用 N/m，m 用 kg，ω₀ 用 rad/s。周期 T、频率 f 和固有角频率的关系为</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>ω</mi><mn>0</mn></msub><mo>=</mo><mn>2</mn><mi>π</mi><mi>f</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mi>T</mi></mfrac></mrow><annotation encoding="application/x-tex">\omega_0=2\pi f=\frac{2\pi}{T}</annotation></semantics></math></div>
<h3>3.5 共振</h3>
<p>外部周期激励的角频率与系统固有角频率相同时，理想无阻尼系统发生共振。频率比为激励角频率与固有角频率之比。</p>
