<section id="part-1">
<p>弹簧形变量从 x₁ 变到 x₂ 时，弹性势能增量为</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">Δ</mi><mi>V</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msubsup><mi>x</mi><mn>2</mn><mn>2</mn></msubsup><mo>−</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msubsup><mi>x</mi><mn>1</mn><mn>2</mn></msubsup></mrow><annotation encoding="application/x-tex">\Delta V=\frac12 kx_2^2-\frac12 kx_1^2</annotation></semantics></math></div>
<p>弹力做正功时弹性势能减少，做负功时弹性势能增加。</p>
<h3>机械能与机械能守恒</h3>
<p>机械能是动能与势能之和。这里的势能包括重力势能和弹性势能。</p>
<p>只有重力或理想弹簧弹力做功时，动能、重力势能和弹性势能可以互相转化，系统的机械能总量保持不变。</p>
