<p class="source-label">流体力学基础公式</p>
<section id="part-1">
<h3>雷诺数</h3>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mi mathvariant="normal">R</mi><mi mathvariant="normal">e</mi></mrow><mo>=</mo><mfrac><mrow><mi>v</mi><mi>d</mi></mrow><mi>ν</mi></mfrac></mrow><annotation encoding="application/x-tex">\mathrm{Re}=\frac{vd}{\nu}</annotation></semantics></math></div>
<p>v 为管道断面平均流速（m/s），d 为管径（m），ν 为运动黏度（m²/s）。</p>
