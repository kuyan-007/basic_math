    等额还本付息
      每期本金与利息之和相同

<section id="part-1">
<p>等额还本付息方式 相当于现值转年金的方式，年金算是等额还的本利和。利息是年初待还余额乘以利率。然后一年一年计算下去。</p>
<p>等额还本利息照付的方式。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>A</mi><mi>t</mi></msub><mo>=</mo><mfrac><msub><mi>I</mi><mi>c</mi></msub><mi>n</mi></mfrac><mo>+</mo><msub><mi>I</mi><mi>c</mi></msub><mrow><mo fence="true">(</mo><mn>1</mn><mo>−</mo><mfrac><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow><mi>n</mi></mfrac><mo fence="true">)</mo></mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">A_t=\frac{I_c}{n}+I_c\left(1-\frac{t-1}{n}\right)i</annotation></semantics></math></div>
<p>这是第t年的还本付息总额。</p>
</section>
