<section id="part-1">
<h3>连续性方程</h3>
<p>恒定流动中，进入控制体的质量流量等于流出的质量流量。不可压缩流体一进两出的分流示例为</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>v</mi><mn>1</mn></msub><msub><mi>A</mi><mn>1</mn></msub><mo>=</mo><msub><mi>v</mi><mn>2</mn></msub><msub><mi>A</mi><mn>2</mn></msub><mo>+</mo><msub><mi>v</mi><mn>3</mn></msub><msub><mi>A</mi><mn>3</mn></msub></mrow><annotation encoding="application/x-tex">v_1 A_1=v_2 A_2+v_3 A_3</annotation></semantics></math></div>
</section>
