<section id="part-1">
<h3>2. 拉伸和压缩</h3>
<p>杆件所受外力的合力作用线与轴线重合时，主要变形为沿轴线的伸长或缩短。</p>
</section>
<section id="part-2">
<h3>2.2 轴向拉压时横截面上的内力</h3>
<p>同一杆段内若没有轴向外载，其各截面的轴力相同。用截面法求 BC 段轴力时，可在该段任取一个截面 m–m 假想切开，保留左段或右段，用内力代替另一段的作用，列轴向力平衡方程。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>F</mi><mi>N</mi></msub><mo>=</mo><msub><mi>F</mi><mn>1</mn></msub><mo>−</mo><msub><mi>F</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">F_N=F_1-F_2</annotation></semantics></math></div>
<p>若结果为负，内力方向与所假定的拉伸方向相反。选取截面另一侧进行平衡分析可得相同结果。</p>
</section>
