<section id="part-1">
<h3>2.信号放大器</h3>
</section>
<section id="part-2">
<p>（1）放大器的作用：放大信号的幅值。</p>
<p>（2）线性放大器：指输出信号幅度与输入信号幅度成正比的放大器。</p>
<p>（3）频率失真：输入信号的频率不能大于放大器的截止频率f。若输入信号大于截止频率f，则会发生频率失真 (也称线性失真)。</p>
<p>（4）非线性失真：放大器工作点进入非线性区，输出与输入不再成正比，波形发生畸变。</p>
</section>
<section id="part-3">
<p>放大器示例中，正常放大保持输入波形形状；若正、负峰值一侧或两侧变平，说明幅度已受限。</p>
</section>
