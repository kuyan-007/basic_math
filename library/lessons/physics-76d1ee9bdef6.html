<h3>12.热力学第二定律</h3>
<p>①功可以完全转化为热；但热不可以完全转化为功，而不引起其他变化</p>
<p>②热量可以自动的从高温物体传递到低温物体；但不可以自动的从低温物体传递到高温物体，而不引起其他变化</p>
<p>③扩散：</p>
