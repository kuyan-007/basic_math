<section id="part-1">
<h3>1.4 斜抛和平抛</h3>
<p>物体以斜向或水平方向的初速度抛出，忽略空气阻力时只受重力，轨迹为抛物线。将初速度分为水平和竖直分量，水平分运动为匀速直线运动；竖直分运动具有向下的恒定加速度。</p>
</section>
<section id="part-2">
<p>若竖直向上为正，斜抛运动的速度分量为</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>v</mi><mi>x</mi></msub><mo>=</mo><msub><mi>v</mi><mrow><mn>0</mn><mi>x</mi></mrow></msub><mo separator="true">,</mo><mspace width="2em"/><msub><mi>v</mi><mi>y</mi></msub><mo>=</mo><msub><mi>v</mi><mrow><mn>0</mn><mi>y</mi></mrow></msub><mo>−</mo><mi>g</mi><mi>t</mi></mrow><annotation encoding="application/x-tex">v_x=v_{0x},\qquad v_y=v_{0y}-gt</annotation></semantics></math></div>
</section>
<section id="part-3">
<h3>斜抛运动的速度分解</h3>
<p>以抛出点 O 为原点，向右为水平正方向，向上为竖直正方向。初速度斜向右上方，与水平轴夹角为 α。水平分速度向右，初始竖直分速度向上，重力加速度向下，轨迹向下弯曲。</p>
</section>
