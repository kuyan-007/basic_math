<section id="part-1">
<h3>3.3 静定桁架</h3>
<p>桁架由杆件组成，常用于大跨度结构。理想铰接桁架的荷载作用于节点时，直杆是二力杆，只传递轴力，杆的横截面上正应力均匀分布。</p>
<p>可以由各节点的力平衡判断杆件轴力和零杆。把连接杆的作用力沿杆轴画在节点上，逐个分析节点，检查哪些杆必须具有零轴力才能满足平衡条件。</p>
