<p class="source-label">流体力学基础公式</p>
<section id="part-1">
<h3>达西定律与均匀渗流</h3>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>v</mi><mo>=</mo><mi>k</mi><mfrac><mi>H</mi><mi>l</mi></mfrac><mo>=</mo><mi>k</mi><mi>J</mi></mrow><annotation encoding="application/x-tex">v=k\frac{H}{l}=kJ</annotation></semantics></math></div>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>J</mi><mo>=</mo><mfrac><mi>H</mi><mi>l</mi></mfrac></mrow><annotation encoding="application/x-tex">J=\frac{H}{l}</annotation></semantics></math></div>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>J</mi><mo>=</mo><mo>−</mo><mfrac><mrow><mi mathvariant="normal">d</mi><mi>H</mi></mrow><mrow><mi mathvariant="normal">d</mi><mi>s</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">J=-\frac{\mathrm dH}{\mathrm ds}</annotation></semantics></math></div>
</section>
