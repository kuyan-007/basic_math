<h3>动量方程</h3>
<p>合外力等于动量的变化率。在一个进口与一个出口之间，有</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo>∑</mo><mi mathvariant="bold-italic">F</mi><mo>=</mo><mi>ρ</mi><mi>Q</mi><mrow><mo fence="true">(</mo><msub><mi>β</mi><mn>2</mn></msub><msub><mi mathvariant="bold-italic">v</mi><mn>2</mn></msub><mo>−</mo><msub><mi>β</mi><mn>1</mn></msub><msub><mi mathvariant="bold-italic">v</mi><mn>1</mn></msub><mo fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\sum\boldsymbol F=\rho Q\left(\beta_2\boldsymbol v_2-\beta_1\boldsymbol v_1\right)</annotation></semantics></math></div>
