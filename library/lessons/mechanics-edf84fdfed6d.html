<section id="part-1">
<h3>3. 力系的平衡</h3>
<p>本节讨论如何用合力、合矩为零求约束力和约束力偶，以及如何分析静定桁架中的零杆。</p>
</section>
<section id="part-2">
<h3>3.2 力系平衡条件</h3>
<p>刚体静止时既不能平移也不能转动，所有外力的矢量和为零，对任意点的外力矩之和也为零。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><munder><mo>∑</mo><mi>i</mi></munder><msub><mi mathvariant="bold-italic">F</mi><mi>i</mi></msub><mo>=</mo><mi mathvariant="bold">0</mi></mrow><annotation encoding="application/x-tex">\sum_i\boldsymbol F_i=\boldsymbol0</annotation></semantics></math></div>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><munder><mo>∑</mo><mi>i</mi></munder><msub><mi mathvariant="bold-italic">M</mi><mi>O</mi></msub><mo stretchy="false">(</mo><msub><mi mathvariant="bold-italic">F</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mo>+</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi mathvariant="bold-italic">m</mi><mi>i</mi></msub><mo>=</mo><mi mathvariant="bold">0</mi></mrow><annotation encoding="application/x-tex">\sum_i\boldsymbol M_O(\boldsymbol F_i)+\sum_i\boldsymbol m_i=\boldsymbol0</annotation></semantics></math></div>
<p>先按约束特点画出反力，再选取便于消去未知量的矩心。可把若干刚体作为整体，也可单独隔离某个构件。</p>
</section>
