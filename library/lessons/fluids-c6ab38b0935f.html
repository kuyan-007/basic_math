<p class="source-label">流体力学基础公式</p>
<section id="part-1">
<h3>恒水位管嘴与孔口出流</h3>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>Q</mi><mo>=</mo><mi>μ</mi><mi>A</mi><msqrt><mrow><mn>2</mn><mi>g</mi><msub><mi>H</mi><mn>0</mn></msub></mrow></msqrt></mrow><annotation encoding="application/x-tex">Q=\mu A\sqrt{2gH_0}</annotation></semantics></math></div>
<p>μ 为流量系数，取值随孔口和管嘴的形式而变。</p>
<p>本份资料列的小孔流量系数为 0.62，管嘴流量系数为 0.62。</p>
</section>
