<section id="part-2">
<p>分子的平均动能包括平动和转动部分，自由度 i 可取 3、5、6。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mover accent="true"><mi>ε</mi><mo>ˉ</mo></mover><mo>=</mo><mfrac><mi>i</mi><mn>2</mn></mfrac><mi>k</mi><mi>T</mi></mrow><annotation encoding="application/x-tex">\bar\varepsilon=\frac{i}{2}kT</annotation></semantics></math></div>
<p>质量为 m 的理想气体的内能为</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>E</mi><mo>=</mo><mfrac><mi>m</mi><mi>M</mi></mfrac><mfrac><mi>i</mi><mn>2</mn></mfrac><mi>R</mi><mi>T</mi><mo>=</mo><mfrac><mi>i</mi><mn>2</mn></mfrac><mi>p</mi><mi>V</mi></mrow><annotation encoding="application/x-tex">E=\frac{m}{M}\frac{i}{2}RT=\frac{i}{2}pV</annotation></semantics></math></div>
