<section id="part-1">
<h3>理想端部约束与长度因数</h3>
<p>两端固定：长度因数为 0.5；一端固定、另一端铰支：约为 0.7；两端铰支：为 1；一端固定、另一端自由：为 2。代入欧拉公式时，用长度因数乘以杆的实际长度。</p>
<h3>端部约束与压杆长度因数</h3>
<p>各图中轴向压力都作用在上端并向下。下表按侧向屈曲时端部是否允许转动、横移区分理想约束。</p>
<div class="table-scroll"><table><thead><tr><th scope="col">两端约束</th><th scope="col">长度因数 μ</th><th scope="col">对应的有效长度（实际杆长 L）</th></tr></thead><tbody><tr><td>两端固定</td><td>0.5</td><td>0.5 L</td></tr><tr><td>一端固定、一端铰支</td><td>约 0.7</td><td>约 0.7 L</td></tr><tr><td>两端铰支</td><td>1</td><td>L</td></tr><tr><td>一端固定、一端自由</td><td>2</td><td>2 L</td></tr></tbody></table></div>
