<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>资金成本率与债务成本</title><link rel="stylesheet" href="../../assets/reading.css"><link rel="stylesheet" href="../../assets/native-text.css"></head>
<body class="standalone-reading">
<article class="study-text" data-reading-page>
<section id="part-1">
<p>资金成本   分为筹资费用和资金使用费。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>资金成本率</mtext><mo>=</mo><mfrac><mtext>筹资使用费</mtext><mtext>筹资净额</mtext></mfrac><mo>=</mo><mfrac><mtext>筹资使用费</mtext><mrow><mtext>筹资额</mtext><mo>−</mo><mtext>筹资费用</mtext></mrow></mfrac></mrow><annotation encoding="application/x-tex">\text{资金成本率}=\frac{\text{筹资使用费}}{\text{筹资净额}}=\frac{\text{筹资使用费}}{\text{筹资额}-\text{筹资费用}}</annotation></semantics></math></div>
<p>债务资金成本</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>K</mi><mi>d</mi></msub><mo>=</mo><mfrac><mrow><mi>I</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>T</mi><mo stretchy="false">)</mo></mrow><mrow><msub><mi>P</mi><mn>0</mn></msub><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>F</mi><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mtext>每年付息额</mtext><mtext> </mtext><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mn>25</mn><mi mathvariant="normal">%</mi><mo stretchy="false">)</mo></mrow><mrow><mtext>债务现值</mtext><mtext> </mtext><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mtext>债务资金筹集费率</mtext><mo stretchy="false">)</mo></mrow></mfrac></mrow><annotation encoding="application/x-tex">K_d=\frac{I(1-T)}{P_0(1-F)}=\frac{\text{每年付息额}\,(1-25\%)}{\text{债务现值}\,(1-\text{债务资金筹集费率})}</annotation></semantics></math></div>
</section>
</article>
</body></html>
