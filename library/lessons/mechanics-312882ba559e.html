<section id="part-1">
<h3>1.5 力的平衡及其推论</h3>
<p>刚体受两力而平衡的充分必要条件是两力大小相等、方向相反，且沿同一直线。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mover accent="true"><mi>F</mi><mo>⃗</mo></mover><mn>1</mn></msub><mo>=</mo><mo>−</mo><msub><mover accent="true"><mi>F</mi><mo>⃗</mo></mover><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">\vec F_1=-\vec F_2</annotation></semantics></math></div>
<p>绳索只能受拉。二力细杆可以受拉，也可以受压，力的作用线沿杆轴。</p>
<p>力的可传性：作用于刚体的力沿其作用线移动到刚体内任一点，作用效果不变。</p>
<p>三力平衡汇交定理：刚体在三个力作用下平衡，若其中两力作用线相交，则三力共面，第三力的作用线通过交点。</p>
