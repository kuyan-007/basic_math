<section id="part-2">
<h3>道尔顿分压定律</h3>
<p>理想气体混合物的总压等于各组分分压之和。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>p</mi><mtext>总</mtext></msub><mo>=</mo><msub><mi>p</mi><mi>A</mi></msub><mo>+</mo><msub><mi>p</mi><mi>B</mi></msub><mo>+</mo><mo>⋯</mo><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>p</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">p_{\text{总}}=p_A+p_B+\cdots=\sum_i p_i</annotation></semantics></math></div>
<p>各组分的分压等于总压乘以该组分的摩尔分数。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>=</mo><mfrac><msub><mi>n</mi><mi>i</mi></msub><mi>n</mi></mfrac></mrow><annotation encoding="application/x-tex">x_i=\frac{n_i}{n}</annotation></semantics></math></div>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>p</mi><mi>i</mi></msub><mo>=</mo><mfrac><msub><mi>n</mi><mi>i</mi></msub><mi>n</mi></mfrac><msub><mi>p</mi><mtext>总</mtext></msub><mo>=</mo><msub><mi>x</mi><mi>i</mi></msub><msub><mi>p</mi><mtext>总</mtext></msub></mrow><annotation encoding="application/x-tex">p_i=\frac{n_i}{n}p_{\text{总}}=x_i p_{\text{总}}</annotation></semantics></math></div>
</section>
