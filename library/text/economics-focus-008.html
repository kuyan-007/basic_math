<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>财务收益与财务费用</title><link rel="stylesheet" href="../../assets/reading.css"><link rel="stylesheet" href="../../assets/native-text.css"></head>

<article class="study-text" data-reading-page>
<h3>财务收益和财务费用</h3>
<div class="table-scroll"><table><thead><tr><th scope="col">类别</th><th scope="col">构成</th></tr></thead><tbody><tr><td>财务收益</td><td>营业收入、补贴收入。补贴收入包括增值税返还、定额补贴及其他形式。</td></tr><tr><td>财务费用</td><td>成本费用、税金、项目投资。项目投资包括建设投资、建设期利息和流动资产投资。</td></tr></tbody></table></div>
<p>讲义列举融资前后的估算项目。</p>
<p>项目融资前：项目投资（不含建设期贷款利息）、营业收入、经营成本。</p>
<p>项目融资后：上述项目另计建设期利息。</p>
</article>
