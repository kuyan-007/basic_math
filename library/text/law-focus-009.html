<h3>中标通知书时限</h3>
<p>2.中标</p>
<p>(1)中标条件。</p>
<p>合理最低价中标《招标投标法》第41条,“中标人的投标应当符合下列条件之一:能够最大限度地满足招标文件中规定的各项综合评价标准;能够满足招标文件的实质性要求，并且经评审的投标价格最低;但是投标价格低于成本的除外”。</p>
<p>(2)中标通知书。</p>
<p>招标人和中标人应当自中标通知书发出之日起30日内，按照招标文件和中标人的投标文件订立书面合同。依法必须进行招标的项目，招标人应当自确定中标人之曰起15日内，向有关行政监督部门提交招标投标情况的书面报告。中标人应当按照合同约定履行义务完成中标项目，不得向他人转让中标项目，也不得将中标项目肢解后分别向他人转让。</p>
