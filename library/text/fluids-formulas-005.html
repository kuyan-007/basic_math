<h3>集水廊道</h3>
<p>单侧、单位宽度的渗流量为</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>q</mi><mo>=</mo><mfrac><mrow><mi>k</mi><mo stretchy="false">(</mo><msup><mi>H</mi><mn>2</mn></msup><mo>−</mo><msup><mi>h</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow><mrow><mn>2</mn><mi>l</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">q=\frac{k(H^2-h^2)}{2l}</annotation></semantics></math></div>
<h3>相似准则</h3>
<p>研究管流阻力问题时，优先考虑雷诺相似；研究溢流时，优先考虑弗劳德相似；以压力和惯性力为主的孔口出流问题可考虑欧拉相似。</p>
