<h3>4.7 违约责任</h3>
<p>例题8-34　甲、乙双方互负债务，没有先后履行顺序，一方在对方履行之前有权拒绝其履行要求,一方在对方履行债务不符合约定时有权拒绝其相应的履行要求。这在我国合同法理论上称作(　)。</p>
<p>A.先履行抗辩权　B.先诉抗辩权</p>
<p>C.同时履行抗辩权</p>
<p>D.不安抗辩权</p>
<p>解析：</p>
<p>同时履行抗辩权是指双务合同的当事人在无先后履行顺序时，一方在对方未给付以前，可拒绝履行自己的债务之权</p>
<p>答案选【C】</p>
