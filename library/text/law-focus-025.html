<h3>申请材料更正</h3>
<p>2.受理</p>
<p>(3)申请材料存在可以当场更正的错误的，应当允许申请人当场更正。</p>
<p>(4)申请材料不齐全或者不符合法定形式的，应当当场或者在5日内一次告知申请人需要补正的全部内容，逾期不告知的，自收到申请材料之日起即为受理。</p>
