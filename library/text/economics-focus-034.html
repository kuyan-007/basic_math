<h3>计算期不同的互斥方案</h3>
<p>最小公倍数法：在方案可重复实施的假设下，把各方案重复到寿命期的最小公倍数，再比较净现值。计算较繁，且技术进步可能使原样重复的假设脱离实际。</p>
<p>年值法：用净年值比较各方案。</p>
<p>研究期法：当备选方案的计算期不能向后延续时，人为选取同一个研究期，计算研究期内现金流量的净现值并比较。</p>
