<h3>费用现值法</h3>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>P</mi><mi>C</mi><mo>=</mo><munderover><mo>∑</mo><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><mi>n</mi></munderover><mo stretchy="false">(</mo><msub><mi>C</mi><mi>t</mi></msub><mo>+</mo><msub><mi>V</mi><mi>t</mi></msub><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><msub><mi>i</mi><mi>c</mi></msub><msup><mo stretchy="false">)</mo><mrow><mo>−</mo><mi>t</mi></mrow></msup><mo>−</mo><mi>S</mi><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><msub><mi>i</mi><mi>c</mi></msub><msup><mo stretchy="false">)</mo><mrow><mo>−</mo><mi>n</mi></mrow></msup></mrow><annotation encoding="application/x-tex">PC=\sum_{t=0}^{n}(C_t+V_t)(1+i_c)^{-t}-S(1+i_c)^{-n}</annotation></semantics></math></div>
<p>PC 是方案的费用现值，Cₜ 是第 t 年的投资，Vₜ 是第 t 年的运行费用，S 是期末残值，i𝑐 是基准收益率，n 是计算期。效益相同时，费用现值较小者较优。</p>
