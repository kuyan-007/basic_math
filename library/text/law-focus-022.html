<h3>撤销权有效期限</h3>
<p>【17年118】.在订立合同时显失公平的合同，当事人可以请求人民法院撤销该合同，其行使撤销权的有效期限是：(　)</p>
<p>(A)自知道或者应当知道撤销事由之日起五年内</p>
<p>(B)自撤销事由发生之日起一年内</p>
<p>(C)自知道或者应当知道撤销事由之日起一年内</p>
<p>(D)自撤销事由发生之日起五年内</p>
<p>解析：当事人的撤销权消灭的情影</p>
<p>①具有撤销权的当事人自知道或者应当知道撤销事由之日起一年内没有行使撤销权；</p>
<p>②具有撤销权的当事人知道撤销事由后明确表示或者以自己的行为放弃撤销权。</p>
<p>答案选【C】</p>
</article>
