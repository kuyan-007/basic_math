<h3>功能分析与功能评价</h3>
<p>例题：产品由 A、B、C、D 四个零部件组成，价值指数依次为 1.8032、1.4246、1.0000 和 0.6419。通常哪个部件不作为价值工程分析对象？</p>
<p>价值系数等于或接近 1，表示功能的重要性与成本比重相当，通常不优先作为分析对象。答案为 C。</p>
