<h3>行政许可设定</h3>
<p>2.行政许可的排除设定事项情形</p>
<p>(1)公民、法人或者其他组织能够自主决定的。</p>
<p>(2)市场竞争机制能够有效调节的。</p>
<p>(3)行业组织或者中介机构能够自律管理的。</p>
<p>(4)行政机关采用事后监督等其他行政管理方式能够解决的。</p>
