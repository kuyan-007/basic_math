<h3>静态投资回收期</h3>
<p>例题：项目在第 0 年支出 60、第 1 年支出 40，第 2 年收入 20，第 3 年至第 8 年每年收入 50。已知基准折现率为 10%，计算静态投资回收期。</p>
<p>第 3 年末累计净现金流量为 −30，第 4 年末累计净现金流量为 20。静态回收期按未折现的累计值计算。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>P</mi><mi>t</mi></msub><mo>=</mo><mn>3</mn><mo>+</mo><mfrac><mn>30</mn><mrow><mn>30</mn><mo>+</mo><mn>20</mn></mrow></mfrac><mo>=</mo><mn>3.6</mn><mtext> 年</mtext></mrow><annotation encoding="application/x-tex">P_t=3+\frac{30}{30+20}=3.6\ \text{年}</annotation></semantics></math></div>
</article>
