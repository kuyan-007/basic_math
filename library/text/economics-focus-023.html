<h3>资产负债率</h3>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mi mathvariant="normal">L</mi><mi mathvariant="normal">O</mi><mi mathvariant="normal">A</mi><mi mathvariant="normal">R</mi></mrow><mo>=</mo><mfrac><mrow><mi>T</mi><mi>L</mi></mrow><mrow><mi>T</mi><mi>A</mi></mrow></mfrac><mo>×</mo><mn>100</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">\mathrm{LOAR}=\frac{TL}{TA}\times100\%</annotation></semantics></math></div>
<p>TL 为期末负债总额，TA 为期末资产总额。该指标反映项目的总体偿债能力。在其他条件相同时，资产负债率越低，总体偿债能力越强。</p>
