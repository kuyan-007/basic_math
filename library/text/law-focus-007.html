<h3>联合体投标</h3>
<p>3.联合共同体投标</p>
<p>两个以上法人或者其他组织可以组成一个联合体，以一个投标人的身份共同投标。</p>
<p>(1)联合体的主体包括两个以上的法人或其他组织。</p>
<p>(2)联合体的各组成单位通过签订共同投标协议来约束彼此的行为,就中标项目承担连带责任。</p>
<p>(3)联合体是为了进行投标及中标后履行合同而组织起来的一个临时性非法人组织。</p>
<p>(4)该联合体以一个投标人的身份共同投标。</p>
<p>(5)联合体各方均应当具备承担招标项目的相应能力，由同一专业的单位组成联合体，按照资质等级较低的单位确定资质等级。</p>
