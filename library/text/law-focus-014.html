<h3>要约撤回和撤销</h3>
<p>3.要约与承诺</p>
<p>1)要约可以撤回，撤回要约的通知应当在要约到达受要约人之前或者与要约同时到达受要约人。</p>
<p>2)要约可以撤销，撤销要约的通知应当在受要约人发出承诺通知之前到达受要约人，但是要约人确定了承诺期限或者以其他形式明示要约不可撤销或者受要约人有理由认为要约是不可撤销的，并已经为履行合同作了准备工作的不能撤销。</p>
