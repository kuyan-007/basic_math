<h3>要约撤回和撤销</h3>
<p>【14年118】.根据《合同法》规定，要约可以撤回和撤销，下列要约，不得撤销的是(　)。</p>
<p>(A)要约到达受要约人　(B)要约人确定了承诺期限</p>
<p>(C)受要约人未发出承诺通知(D)受要约人即将发出承诺通知</p>
<p>解析：</p>
<p>《合同法》第十九条规定，有下列情形之一的，要约不得撤销：①要约人确定了承诺期限或者以其他形式明示要约不可撤销；②受要约人有理由认为要约是不可撤销的，并已经为履行合同作了准备工作。</p>
<p>答案选【B】</p>
