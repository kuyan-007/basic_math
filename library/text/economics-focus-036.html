<h3>价值工程</h3>
<p>核心是对产品或作业进行功能分析，目的是以尽可能低的寿命周期成本实现必要功能，提高产品或作业的价值。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>V</mi><mo>=</mo><mfrac><mi>F</mi><mi>C</mi></mfrac><mo>=</mo><mfrac><mtext>功能评价值（目标成本）</mtext><mtext>现实成本</mtext></mfrac></mrow><annotation encoding="application/x-tex">V=\frac{F}{C}=\frac{\text{功能评价值（目标成本）}}{\text{现实成本}}</annotation></semantics></math></div>
<p>提高价值的五种途径：功能提高且成本降低；成本不变而功能提高；功能不变而成本下降；功能略降而成本下降幅度更大；成本略增而功能提高幅度更大。</p>
