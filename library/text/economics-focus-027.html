<h3>产品售价的敏感性系数</h3>
<p>例题：销售价格从 1000 元升至 1100 元，财务净现值从 2000 万元增至 2560 万元，求净现值对售价的敏感性系数。</p>
<p>选项为 A 2.19，B 2.40，C 2.60，D 2.80。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>S</mi><mrow><mi>A</mi><mi>F</mi></mrow></msub><mo>=</mo><mfrac><mrow><mo stretchy="false">(</mo><mn>2560</mn><mo>−</mo><mn>2000</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>2000</mn></mrow><mrow><mo stretchy="false">(</mo><mn>1100</mn><mo>−</mo><mn>1000</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>1000</mn></mrow></mfrac><mo>=</mo><mn>2.80</mn></mrow><annotation encoding="application/x-tex">S_{AF}=\frac{(2560-2000)/2000}{(1100-1000)/1000}=2.80</annotation></semantics></math></div>
<p>答案为 D。</p>
</article>
