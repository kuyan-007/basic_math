<h3>资本金与债务资金的筹措</h3>
<p>项目资本金的筹措方式包括股东直接投资、股票融资及政府投资。</p>
<p>债务资金的筹措方式包括信贷融资（贷款）、债券融资（企业债券）、融资租赁、既有法人内部融资等。优先股和可转换债券列为准股本资金。</p>
<p>优先股介于股本资金和负债之间。优先股股东通常不参与经营管理，领取固定股息，一般不再参加红利分配。其受偿顺序先于普通股股东，后于其他债权人。</p>
<p>可转换债券具有可转换性、债权性和股权性。在规定期限内，投资者可以按转换价格将债券转换为一定数量的股票，也可以选择不转换。</p>
