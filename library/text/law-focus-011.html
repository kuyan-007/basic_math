<h3>要约和要约邀请</h3>
<p>3.要约与承诺</p>
<p>(1)要约:</p>
<p>是一方当事人以缔结合同为目的，向对方当事人提出合同条件，希望对方当事人接受的意思表示。发出要约的一方称要约人，接受要约的一方称受要约人。</p>
<p>(2)承诺:</p>
<p>受要约人在有效期内，“完全”同意要约条款的意思表示</p>
<p>要约人发出要约，受要约人向要约人作出承诺。</p>
