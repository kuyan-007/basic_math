<h3>资金成本的三种计算</h3>
<p>固定增长股利的普通股，股利固定增长率为 G。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>K</mi><mi>s</mi></msub><mo>=</mo><mfrac><msub><mi>D</mi><mn>1</mn></msub><mrow><msub><mi>P</mi><mn>0</mn></msub><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>f</mi><mo stretchy="false">)</mo></mrow></mfrac><mo>+</mo><mi>G</mi></mrow><annotation encoding="application/x-tex">K_s=\frac{D_1}{P_0(1-f)}+G</annotation></semantics></math></div>
<p>资本资产定价模型</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>K</mi><mi>s</mi></msub><mo>=</mo><msub><mi>R</mi><mi>f</mi></msub><mo>+</mo><mi>β</mi><mo stretchy="false">(</mo><msub><mi>R</mi><mi>m</mi></msub><mo>−</mo><msub><mi>R</mi><mi>f</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">K_s=R_f+\beta(R_m-R_f)</annotation></semantics></math></div>
<p>按面值发行的优先股</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>K</mi><mi>p</mi></msub><mo>=</mo><mfrac><msub><mi>D</mi><mi>p</mi></msub><mrow><msub><mi>P</mi><mn>0</mn></msub><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>f</mi><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>0</mn></msub><mi>i</mi></mrow><mrow><msub><mi>P</mi><mn>0</mn></msub><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>f</mi><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mi>i</mi><mrow><mn>1</mn><mo>−</mo><mi>f</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">K_p=\frac{D_p}{P_0(1-f)}=\frac{P_0 i}{P_0(1-f)}=\frac{i}{1-f}</annotation></semantics></math></div>
