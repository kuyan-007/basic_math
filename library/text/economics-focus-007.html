<h3>资金等值计算</h3>
<p>例题（2018 年第 107 题）：五年后设备更新需 600 万元，存款年利率为 5%，从现在起每年年末等额存款。已知偿债基金系数为 0.18097，求每年的存款额。</p>
<p>备选答案为 A 78.65 万元，B 108.58 万元，C 120 万元，D 165.77 万元。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>A</mi><mo>=</mo><mn>600</mn><mo stretchy="false">(</mo><mi>A</mi><mi mathvariant="normal">/</mi><mi>F</mi><mo separator="true">,</mo><mn>5</mn><mi mathvariant="normal">%</mi><mo separator="true">,</mo><mn>5</mn><mo stretchy="false">)</mo><mo>=</mo><mn>600</mn><mo>×</mo><mn>0.18097</mn><mo>≈</mo><mn>108.58</mn><mtext> 万元</mtext></mrow><annotation encoding="application/x-tex">A=600(A/F,5\%,5)=600\times0.18097\approx108.58\ \text{万元}</annotation></semantics></math></div>
<p>答案为 B。</p>
</article>
