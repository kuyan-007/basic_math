<h3>合同履行抗辩权</h3>
<p>3.合同履行抗辩权</p>
<p>(1)同时履行抗辩权。</p>
<p>同时履行抗辩权是指双务合同的当事人在无先后履行顺序时，一方在对方未给付以前，可拒绝履行自己的债务之权</p>
<p>(2)先履行抗辩权。</p>
<p>先履行抗辩权是指当事人互负债务,有先后履行顺序的，先履行一方未履行之前，后履行一方有权拒绝其履行请求。</p>
<p>(3)不安抗辩权。</p>
<p>后给付义务人的履行能力明显降低，有不能为对待给付的现实危险。</p>
