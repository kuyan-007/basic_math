<h3>现金流量图的含义</h3>
<p>现金流量是一个经济系统在某个时点实际发生的资金流入或流出。现金流量图用时间轴表示一段时间内发生的现金流量。</p>
<p>线段长度表示金额，箭头向上表示流入、向下表示流出，横轴数字表示时间点。时间点“1”表示第一年末，也表示第二年初。</p>
<p>示例中的第 1 年末流出 100，第 2 年末流出 150，第 3 年末流入 200，第 n−1 年末和第 n 年末各流入 200。读图需同时识别大小、方向和时间点。</p>
