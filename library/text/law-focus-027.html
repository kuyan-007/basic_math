<h3>节能标准和节能评估审查</h3>
<p>1.节能标准</p>
<p>建筑工程的建设、设计、施工和监理单位应当遵守建筑节能标准。</p>
<p>图中将地方标准、企业标准分别与国家标准和行业标准比较，标示地方标准、企业标准可以更严。</p>
<p>2.节能评估和审査</p>
<p>国家实行固定资产投资项目节能评估和审查制度。</p>
<p>不符合强制性节能标准的项目：</p>
<p>①依法负责项目审批或者核准的机关不得批准或者核准建设;</p>
<p>②建设单位不得开工建设；</p>
<p>③已经建成的，不得投入生产、使用。</p>
