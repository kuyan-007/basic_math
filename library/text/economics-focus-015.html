<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>资本资产定价模型</title><link rel="stylesheet" href="../../assets/reading.css"><link rel="stylesheet" href="../../assets/native-text.css"></head>

<article class="study-text" data-reading-page>
<h3>资本资产定价模型</h3>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>K</mi><mi>s</mi></msub><mo>=</mo><msub><mi>R</mi><mi>f</mi></msub><mo>+</mo><mi>β</mi><mo stretchy="false">(</mo><msub><mi>R</mi><mi>m</mi></msub><mo>−</mo><msub><mi>R</mi><mi>f</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">K_s=R_f+\beta(R_m-R_f)</annotation></semantics></math></div>
<p>R𝒇 为无风险报酬率，Rₘ 为市场投资组合报酬率，β 为股票的贝塔系数。</p>
<p>例题：无风险利率为 6%，市场回报率为 8%，股票的 β 为 1.5。资金成本为</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>K</mi><mi>s</mi></msub><mo>=</mo><mn>6</mn><mi mathvariant="normal">%</mi><mo>+</mo><mn>1.5</mn><mo stretchy="false">(</mo><mn>8</mn><mi mathvariant="normal">%</mi><mo>−</mo><mn>6</mn><mi mathvariant="normal">%</mi><mo stretchy="false">)</mo><mo>=</mo><mn>9</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">K_s=6\%+1.5(8\%-6\%)=9\%</annotation></semantics></math></div>
<p>税前债务成本加风险溢价法考虑股票投资比债券投资承担的额外风险。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>普通股资本成本</mtext><mo>=</mo><mtext>债务资本成本</mtext><mo>+</mo><mtext>股票投资的额外风险报酬率</mtext></mrow><annotation encoding="application/x-tex">\text{普通股资本成本}=\text{债务资本成本}+\text{股票投资的额外风险报酬率}</annotation></semantics></math></div>
</article>
</body></html>
