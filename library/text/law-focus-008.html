<h3>评标委员会</h3>
<p>1.评标</p>
<p>(1)评标委员会。</p>
<p>依法必须进行招标的项目，其评标委员会由招标人的代表和有关技术、经济等方面的专家组成，成员人数为5人以上单数，其中技术、经济等方面的专家不得少于成员总数的2/3。</p>
<p>专家应当从事相关领域工作满8年并具有高级职称或者具有同等专业水平，由招标人从国务院有关部门或者省改人民政府有关部门提供的专家名册或者招标代理机构的专家库内的相关专业的专家名单中确定;一般招标项目可以采取随机抽取方式，特殊招标项目可以由招标人直接确定。</p>
<p>评标结束，评标委员会向招标人提出书面评标报告，并推荐合格的中标候选人</p>
