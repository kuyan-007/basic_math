<h3>要约和要约邀请</h3>
<p>【13年118】.根据《合同法》规定，下列行为中不属于要约邀请的是(　)。</p>
<p>(A)某建设单位发布招标公告　(B)某招标单位发出中标通知书</p>
<p>(C)某上市公司发出招股说明书(D)某商场寄送的价目表</p>
<p>解析：</p>
<p>《合同法》第十五条规定，要约邀请是希望他人向自己发出要约的意思表示。寄送的价目表、拍卖公告、招标公告、招股说明书、商业广告等为要约邀请。商业广告的内容符合要约规定的，视为要约。</p>
<p>答案选【B】</p>
