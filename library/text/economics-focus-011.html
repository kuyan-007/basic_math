<h3>经营成本</h3>
<p>经营成本是财务分析中对现金流量分析时使用的特定概念，构成项目运营期现金流出的主体。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>经营成本</mtext><mo>=</mo><mtext>外购原材料、燃料及动力费</mtext><mo>+</mo><mtext>工资及福利费</mtext><mo>+</mo><mtext>修理费</mtext><mo>+</mo><mtext>其他费用</mtext></mrow><annotation encoding="application/x-tex">\text{经营成本}=\text{外购原材料、燃料及动力费}+\text{工资及福利费}+\text{修理费}+\text{其他费用}</annotation></semantics></math></div>
<p>其他费用是从制造费用、管理费用和营业费用中扣除折旧费、摊销费、修理费、工资及福利费后的部分。</p>
</article>
