<h3>五种盈利能力指标</h3>
<p>财务净现值（FNPV）、财务内部收益率（FIRR）、静态投资回收期（Pₜ）、总投资收益率（ROI）和项目资本金净利润率（ROE）。</p>
<p>财务净现值是各期净现金流量在基准时点折现值的代数和。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mi mathvariant="normal">F</mi><mi mathvariant="normal">N</mi><mi mathvariant="normal">P</mi><mi mathvariant="normal">V</mi></mrow><mo>=</mo><munderover><mo>∑</mo><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mfrac><mrow><mo stretchy="false">(</mo><mi>C</mi><mi>I</mi><mo>−</mo><mi>C</mi><mi>O</mi><msub><mo stretchy="false">)</mo><mi>t</mi></msub></mrow><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><msub><mi>i</mi><mi>c</mi></msub><msup><mo stretchy="false">)</mo><mi>t</mi></msup></mrow></mfrac></mrow><annotation encoding="application/x-tex">\mathrm{FNPV}=\sum_{t=1}^{n}\frac{(CI-CO)_t}{(1+i_c)^t}</annotation></semantics></math></div>
<p>CI 为现金流入，CO 为现金流出，t 表示年份，n 为计算期，i𝑐 为折现率。财务净现值大于或等于零时，方案在该折现率下可接受；小于零时不可接受。</p>
