<article class="study-text" data-reading-page>
<h3>效益比选</h3>
<p>方法包括净现值法、净年值法、差额内部收益率法和差额净现值法。</p>
<p>净现值比较法</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mi mathvariant="normal">N</mi><mi mathvariant="normal">P</mi><mi mathvariant="normal">V</mi></mrow><mo stretchy="false">(</mo><msub><mi>i</mi><mi>c</mi></msub><mo stretchy="false">)</mo><mo>=</mo><munderover><mo>∑</mo><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mo stretchy="false">(</mo><mi>C</mi><mi>I</mi><mo>−</mo><mi>C</mi><mi>O</mi><msub><mo stretchy="false">)</mo><mi>t</mi></msub><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><msub><mi>i</mi><mi>c</mi></msub><msup><mo stretchy="false">)</mo><mrow><mo>−</mo><mi>t</mi></mrow></msup></mrow><annotation encoding="application/x-tex">\mathrm{NPV}(i_c)=\sum_{t=1}^{n}(CI-CO)_t(1+i_c)^{-t}</annotation></semantics></math></div>
<p>净年值比较法</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mi mathvariant="normal">N</mi><mi mathvariant="normal">A</mi><mi mathvariant="normal">V</mi></mrow><mo stretchy="false">(</mo><msub><mi>i</mi><mi>c</mi></msub><mo stretchy="false">)</mo><mo>=</mo><mrow><mi mathvariant="normal">N</mi><mi mathvariant="normal">P</mi><mi mathvariant="normal">V</mi></mrow><mo stretchy="false">(</mo><msub><mi>i</mi><mi>c</mi></msub><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mi>A</mi><mi mathvariant="normal">/</mi><mi>P</mi><mo separator="true">,</mo><msub><mi>i</mi><mi>c</mi></msub><mo separator="true">,</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathrm{NAV}(i_c)=\mathrm{NPV}(i_c)(A/P,i_c,n)</annotation></semantics></math></div>
<p>净现值、净年值均为正的方案可选。在可比条件下，其值越大越优。比较寿命期不等且可重复实施的互斥方案时，采用净年值较方便。</p>
