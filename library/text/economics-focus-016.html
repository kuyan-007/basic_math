<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>债务资金成本</title><link rel="stylesheet" href="../../assets/reading.css"><link rel="stylesheet" href="../../assets/native-text.css"></head>

<article class="study-text" data-reading-page>
<h3>优先股资金成本</h3>
<p>Kₚ 为优先股成本率，Dₚ 为每年股息，P₀ 为票面值，i 为股息率，f 为筹资费率。按面值发行时</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>K</mi><mi>p</mi></msub><mo>=</mo><mfrac><msub><mi>D</mi><mi>p</mi></msub><mrow><msub><mi>P</mi><mn>0</mn></msub><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>f</mi><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>0</mn></msub><mi>i</mi></mrow><mrow><msub><mi>P</mi><mn>0</mn></msub><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>f</mi><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mi>i</mi><mrow><mn>1</mn><mo>−</mo><mi>f</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">K_p=\frac{D_p}{P_0(1-f)}=\frac{P_0 i}{P_0(1-f)}=\frac{i}{1-f}</annotation></semantics></math></div>
<p>例题：发行优先股，面值共 200 万元，筹资费率为 4%，年股息率为 14%。资金成本率为</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>K</mi><mi>p</mi></msub><mo>=</mo><mfrac><mrow><mn>14</mn><mi mathvariant="normal">%</mi></mrow><mrow><mn>1</mn><mo>−</mo><mn>4</mn><mi mathvariant="normal">%</mi></mrow></mfrac><mo>≈</mo><mn>14.58</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">K_p=\frac{14\%}{1-4\%}\approx14.58\%</annotation></semantics></math></div>
</article>
</body></html>
