<h3>要约失效</h3>
<p>【11年117】.按照《合同法》的规定，下列情形中，要约不失效的是()。</p>
<p>(A)拒绝要约的通知到达要约人</p>
<p>(B)要约人依法撤销要约</p>
<p>(C)承诺期限届满，受要约人未作出承诺</p>
<p>(D)受要约人对要约的内容作出非实质性变更</p>
<p>解析：</p>
<p>根据《合同法》第二十条的规定，有下列情形之一的，要约失效：①拒绝要约的通知到达要约人；②要约人依法撤销要约；③承诺期限届满，受要约人未作出承诺：④受要约人对要约的内容作出实质性变更。</p>
<p>答案选【D】</p>
