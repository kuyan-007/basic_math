<h3>三同时、安全生产设备的生产检测投入使用</h3>
<p>3.安全设施“三同时”制度生产经营单位新建、改建、扩建工程项目的安全设施,必须与主体工程同时设计、同时施工、同时投入生产和使用。</p>
<p>4.安全生产设备、设施</p>
<p>(3)生产经营单位使用的涉及生命安全、危险性较大的特种设备，以及危险物品的容器、运输工具，必须按照国家有关规定，由专业生产单位生产，并经取得专业资质的检测、检验机构检测、检验合格，取得安全使用证或者安全标志，方可投入使用。</p>
