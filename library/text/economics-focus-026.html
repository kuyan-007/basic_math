<h3>敏感性系数和临界点</h3>
<p>评价指标 A 对不确定因素 F 的敏感性系数等于二者相对变化率的比值。</p>
<div class="formula"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>S</mi><mrow><mi>A</mi><mi>F</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi mathvariant="normal">Δ</mi><mi>A</mi><mi mathvariant="normal">/</mi><mi>A</mi></mrow><mrow><mi mathvariant="normal">Δ</mi><mi>F</mi><mi mathvariant="normal">/</mi><mi>F</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">S_{AF}=\frac{\Delta A/A}{\Delta F/F}</annotation></semantics></math></div>
<p>系数为正表示同方向变化，为负表示反方向变化。绝对值越大，指标对该因素的变化越敏感。</p>
<p>以基准收益率作为计算临界点的依据时，同一项目的基准收益率越高，临界点通常越低。在给定基准收益率下，达到临界点所需的不利变化幅度越小，项目越敏感。</p>
