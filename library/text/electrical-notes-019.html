<h3>（3）带通滤波器</h3>
<p>上下截止频率之间的信号能够通过，低于下限或高于上限的信号受到衰减。</p>
<h3>（4）带阻滤波器</h3>
<p>上下截止频率之间的信号受到衰减，低于下限或高于上限的信号能够通过。</p>
<h3>6.3滤波器的实际应用</h3>
<p>频率为周期的倒数，周期越小，频率越大。此外，规定直流信号（幅度不随时间改变的信号）的频率为0。</p>
<p>总信号由低频成分和高频成分叠加而成。高通滤波器抑制低频成分，低通滤波器抑制高频成分。</p>
<p>示例：</p>
<h3>滤波器对总信号的分离</h3>
<p>总信号在一条固定水平线上方和下方周期起伏。低频部分画成一条水平线，对应直流分量；高频部分围绕零轴正负交替变化。两部分在同一时间相加可恢复总信号。</p>
